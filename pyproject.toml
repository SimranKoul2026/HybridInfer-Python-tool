[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridinfer"
version = "0.2.1"
description = "Reliability-aware LLM router: run requests on your local model and automatically fall back to a remote model when local inference stalls or crashes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Simran Koul" }]
keywords = [
    "llm",
    "local-llm",
    "ollama",
    "routing",
    "reliability",
    "fallback",
    "openai",
    "inference",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24",
    "fastapi>=0.100",
    "uvicorn>=0.22",
    "anyio>=3.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hybridinfer = "hybridinfer.cli:main"

[project.urls]
Homepage = "https://github.com/SimranKoul2026/HybridInfer-Python-tool"
Repository = "https://github.com/SimranKoul2026/HybridInfer-Python-tool"
Issues = "https://github.com/SimranKoul2026/HybridInfer-Python-tool/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hybridinfer*"]
